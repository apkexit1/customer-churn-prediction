<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Customer Churn Prediction
    </h1>

    <form id="predictionForm">

        <div class="row">

            <!-- ================= FIRST COLUMN ================= -->

            <div class="col-md-4">

                <div class="mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select id="gender" class="form-select">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="SeniorCitizen" class="form-label">
                        Senior Citizen
                    </label>
                    <select id="SeniorCitizen" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="Partner" class="form-label">Partner</label>
                    <select id="Partner" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="Dependents" class="form-label">
                        Dependents
                    </label>
                    <select id="Dependents" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="tenure" class="form-label">
                        Tenure (months)
                    </label>
                    <input
                        type="number"
                        id="tenure"
                        class="form-control"
                        min="0"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="PhoneService" class="form-label">
                        Phone Service
                    </label>
                    <select id="PhoneService" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

            </div>


            <!-- ================= SECOND COLUMN ================= -->

            <div class="col-md-4">

                <div class="mb-3">
                    <label for="MultipleLines" class="form-label">
                        Multiple Lines
                    </label>
                    <select id="MultipleLines" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="No phone service">
                            No phone service
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="InternetService" class="form-label">
                        Internet Service
                    </label>
                    <select id="InternetService" class="form-select">
                        <option value="DSL">DSL</option>
                        <option value="Fiber optic">Fiber optic</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="OnlineSecurity" class="form-label">
                        Online Security
                    </label>
                    <select id="OnlineSecurity" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="OnlineBackup" class="form-label">
                        Online Backup
                    </label>
                    <select id="OnlineBackup" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="DeviceProtection" class="form-label">
                        Device Protection
                    </label>
                    <select id="DeviceProtection" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="TechSupport" class="form-label">
                        Tech Support
                    </label>
                    <select id="TechSupport" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

            </div>


            <!-- ================= THIRD COLUMN ================= -->

            <div class="col-md-4">

                <div class="mb-3">
                    <label for="StreamingTV" class="form-label">
                        Streaming TV
                    </label>
                    <select id="StreamingTV" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="StreamingMovies" class="form-label">
                        Streaming Movies
                    </label>
                    <select id="StreamingMovies" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="No internet service">
                            No internet service
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="Contract" class="form-label">
                        Contract
                    </label>
                    <select id="Contract" class="form-select">
                        <option value="Month-to-month">
                            Month-to-month
                        </option>
                        <option value="One year">One year</option>
                        <option value="Two year">Two year</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="PaperlessBilling" class="form-label">
                        Paperless Billing
                    </label>
                    <select id="PaperlessBilling" class="form-select">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="PaymentMethod" class="form-label">
                        Payment Method
                    </label>
                    <select id="PaymentMethod" class="form-select">
                        <option value="Electronic check">
                            Electronic check
                        </option>
                        <option value="Mailed check">
                            Mailed check
                        </option>
                        <option value="Bank transfer (automatic)">
                            Bank transfer (automatic)
                        </option>
                        <option value="Credit card (automatic)">
                            Credit card (automatic)
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="MonthlyCharges" class="form-label">
                        Monthly Charges
                    </label>
                    <input
                        type="number"
                        step="0.01"
                        id="MonthlyCharges"
                        class="form-control"
                        min="0"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="TotalCharges" class="form-label">
                        Total Charges
                    </label>
                    <input
                        type="number"
                        step="0.01"
                        id="TotalCharges"
                        class="form-control"
                        min="0"
                        required
                    >
                </div>

            </div>

        </div>


        <!-- ================= PREDICT BUTTON ================= -->

        <button
            type="submit"
            class="btn btn-primary w-100 mt-3"
            id="predictButton"
        >
            Predict
        </button>

    </form>


    <!-- ================= RESULT ================= -->

    <div id="result" class="mt-4 text-center"></div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

document
    .getElementById("predictionForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const button = document.getElementById("predictButton");
        const resultDiv = document.getElementById("result");

        button.disabled = true;
        button.innerText = "Predicting...";

        const data = {

            gender: document.getElementById("gender").value,

            SeniorCitizen:
                parseInt(
                    document.getElementById("SeniorCitizen").value
                ),

            Partner:
                document.getElementById("Partner").value,

            Dependents:
                document.getElementById("Dependents").value,

            tenure:
                parseInt(
                    document.getElementById("tenure").value
                ),

            PhoneService:
                document.getElementById("PhoneService").value,

            MultipleLines:
                document.getElementById("MultipleLines").value,

            InternetService:
                document.getElementById("InternetService").value,

            OnlineSecurity:
                document.getElementById("OnlineSecurity").value,

            OnlineBackup:
                document.getElementById("OnlineBackup").value,

            DeviceProtection:
                document.getElementById("DeviceProtection").value,

            TechSupport:
                document.getElementById("TechSupport").value,

            StreamingTV:
                document.getElementById("StreamingTV").value,

            StreamingMovies:
                document.getElementById("StreamingMovies").value,

            Contract:
                document.getElementById("Contract").value,

            PaperlessBilling:
                document.getElementById("PaperlessBilling").value,

            PaymentMethod:
                document.getElementById("PaymentMethod").value,

            MonthlyCharges:
                parseFloat(
                    document.getElementById("MonthlyCharges").value
                ),

            TotalCharges:
                parseFloat(
                    document.getElementById("TotalCharges").value
                )
        };


        try {

            const response = await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            });


            const result = await response.json();


            if (!response.ok) {

                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong>
                        ${result.detail || "Prediction failed"}
                    </div>
                `;

                return;
            }


            const probability =
                (result.probability * 100).toFixed(2);


            if (result.prediction === "Churn") {

                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h3>⚠️ Customer Will Churn</h3>
                        <p>
                            Churn Probability:
                            <strong>${probability}%</strong>
                        </p>
                    </div>
                `;

            } else {

                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h3>✅ Customer Will Not Churn</h3>
                        <p>
                            Churn Probability:
                            <strong>${probability}%</strong>
                        </p>
                    </div>
                `;

            }

        }


        catch (error) {

            console.error(error);

            resultDiv.innerHTML = `
                <div class="alert alert-danger">
                    <strong>Error:</strong>
                    Could not connect to the FastAPI server.
                </div>
            `;

        }


        finally {

            button.disabled = false;
            button.innerText = "Predict";

        }

    });

</script>

</body>
</html>
